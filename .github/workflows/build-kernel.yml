name: Build kernel

on:
  push:
    branches:
    - '**'
    tags:
    - 'v*'

permissions:
  contents: write # Required to attach artifacts to a release

jobs:
  build_gcc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils gcc-multilib nasm

      - name: Build kernel
        run: ./build.sh --gcc --check-headers

  build_clang:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils clang nasm

      - name: Build kernel
        run: ./build.sh --clang --check-headers

  create_release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils clang nasm

      - name: Build kernel
        run: ./build.sh --clang

      - name: Create release
        run: |
          gh release create "${GITHUB_REF_NAME}" build/naros.bin --title "Release ${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

