name: Execute unit tests

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  execute-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils gcc-multilib nasm

      - name: Execute tests
        run: ./test.sh


